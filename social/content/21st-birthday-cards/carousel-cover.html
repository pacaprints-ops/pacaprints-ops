<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>21st Birthday Cards — Carousel Cover — Paca Prints</title>
  <link href="https://fonts.googleapis.com/css2?family=Varela+Round&family=Sacramento&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      padding: 40px;
      background: #bbb;
    }
    .preview-label {
      font-family: sans-serif;
      font-size: 13px;
      color: #888;
      margin-bottom: 12px;
    }
  </style>
</head>
<body>

  <div class="preview-label">Instagram Carousel Cover — 1080×1080px (shown at 50% scale)</div>

  <div style="width: 1100px; height: 560px; overflow: hidden;">
    <div id="post" style="
      width: 1080px;
      height: 1080px;
      transform: scale(0.5);
      transform-origin: top left;
      position: relative;
      overflow: hidden;
      background: #fceee4;
      font-family: 'Varela Round', Arial, sans-serif;
    ">

      <!-- Warm peach gradient background -->
      <div style="
        position: absolute;
        inset: 0;
        background: radial-gradient(ellipse at 50% 45%, #f7d9c4 0%, #fceee4 75%);
      "></div>

      <!-- Large mint circle — background decoration -->
      <div style="
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -52%);
        width: 820px;
        height: 820px;
        border-radius: 50%;
        background: #b8e0d2;
        opacity: 0.32;
      "></div>

      <!-- Smaller mint ring — inner accent -->
      <div style="
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -52%);
        width: 640px;
        height: 640px;
        border-radius: 50%;
        border: 3px solid rgba(184,224,210,0.7);
        background: transparent;
      "></div>

      <!-- Logo — top centre -->
      <div style="
        position: absolute;
        top: 52px;
        left: 50%;
        transform: translateX(-50%);
      ">
        <img
          src="../../assets/PacaPrints%20Logo%20.png"
          style="width: 200px; display: block; mix-blend-mode: multiply; opacity: 0.9;"
          alt="Paca Prints"
        >
      </div>

      <!-- Main number — hero -->
      <div style="
        position: absolute;
        top: 190px;
        width: 100%;
        text-align: center;
        font-family: 'Varela Round', Arial, sans-serif;
        font-size: 340px;
        color: #3d2c00;
        line-height: 1;
        letter-spacing: -8px;
      ">21</div>

      <!-- Sacramento sub-header -->
      <div style="
        position: absolute;
        top: 596px;
        width: 100%;
        text-align: center;
        font-family: 'Sacramento', cursive;
        font-size: 72px;
        color: #3d2c00;
        letter-spacing: 1px;
      ">Birthday Card Collection</div>

      <!-- Tagline -->
      <div style="
        position: absolute;
        top: 700px;
        width: 100%;
        text-align: center;
        font-family: 'Varela Round', Arial, sans-serif;
        font-size: 30px;
        color: #3d2c00;
        opacity: 0.65;
        letter-spacing: 0.5px;
      ">The cards they'll actually want to keep.</div>

      <!-- Swipe CTA pill -->
      <div style="
        position: absolute;
        bottom: 64px;
        left: 50%;
        transform: translateX(-50%);
        background: #b8e0d2;
        color: #3d2c00;
        font-family: 'Varela Round', Arial, sans-serif;
        font-size: 30px;
        padding: 18px 60px;
        border-radius: 60px;
        white-space: nowrap;
        box-shadow: 0 4px 16px rgba(61,44,0,0.10);
      ">From £3.49 &nbsp;·&nbsp; swipe to shop →</div>

    </div>
  </div>

</body>
</html>
