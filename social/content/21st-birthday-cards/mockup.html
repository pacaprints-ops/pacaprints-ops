<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>21st Birthday Cards — Paca Prints</title>
  <link href="https://fonts.googleapis.com/css2?family=Varela+Round&family=Sacramento&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      padding: 40px;
      background: #ddd;
    }
    .preview-label {
      font-family: sans-serif;
      font-size: 13px;
      color: #888;
      margin-bottom: 12px;
    }
  </style>
</head>
<body>

  <div class="preview-label">Instagram Feed Post — 1080×1080px (shown at 50% scale)</div>

  <div style="width: 1100px; height: 560px; overflow: hidden;">
    <div id="post" style="
      width: 1080px;
      height: 1080px;
      transform: scale(0.5);
      transform-origin: top left;
      background-color: #f7d9c4;
      position: relative;
      box-sizing: border-box;
      overflow: hidden;
      font-family: 'Varela Round', Arial, sans-serif;
    ">

      <!-- Mint curved top panel -->
      <div style="
        position: absolute;
        top: 0; left: 0; right: 0;
        height: 300px;
        background: #b8e0d2;
        border-radius: 0 0 55% 55% / 0 0 80px 80px;
      "></div>

      <!-- Logo — top centre -->
      <div style="
        position: absolute;
        top: 28px;
        left: 50%;
        transform: translateX(-50%);
        width: 240px;
        text-align: center;
      ">
        <img
          src="../../assets/PacaPrints%20Logo%20.png"
          style="width: 240px; display: block; mix-blend-mode: multiply;"
          alt="Paca Prints logo"
        >
      </div>

      <!-- Sacramento label -->
      <div style="
        position: absolute;
        top: 226px;
        width: 100%;
        text-align: center;
        font-family: 'Sacramento', cursive;
        font-size: 50px;
        color: #3d2c00;
        letter-spacing: 1px;
      ">21st Birthday Collection</div>

      <!-- Headline -->
      <div style="
        position: absolute;
        top: 302px;
        width: 100%;
        text-align: center;
        padding: 0 80px;
        box-sizing: border-box;
        font-family: 'Varela Round', Arial, sans-serif;
        font-size: 68px;
        color: #3d2c00;
        line-height: 1.2;
      ">The card they'll actually want to keep. 🎀</div>

      <!-- Card 1 — Cute Bow Twenty First Birthday Card (left) -->
      <div style="
        position: absolute;
        top: 480px;
        left: 82px;
        width: 270px;
        height: 340px;
        border-radius: 16px;
        overflow: hidden;
        box-shadow: 0 8px 24px rgba(61,44,0,0.15);
      ">
        <img
          src="https://pacaprints.com/cdn/shop/files/eda25c90e6f530b2401115a0725f85b1_3384cd1d-4fc0-487f-b63f-e478d61b24ce.png?v=1784066632&width=600"
          style="width: 100%; height: 100%; object-fit: cover; display: block;"
          alt="Cute Bow Twenty First Birthday Card"
        >
      </div>

      <!-- Card 2 — Personalised Pink 21st Birthday Card (centre, raised) -->
      <div style="
        position: absolute;
        top: 448px;
        left: 405px;
        width: 270px;
        height: 340px;
        border-radius: 16px;
        overflow: hidden;
        box-shadow: 0 12px 32px rgba(61,44,0,0.2);
      ">
        <img
          src="https://pacaprints.com/cdn/shop/files/ae50d98db9e55b0ba20c4d09e35fd640.png?v=1784066181&width=600"
          style="width: 100%; height: 100%; object-fit: cover; display: block;"
          alt="Personalised Pink 21st Birthday Card"
        >
      </div>

      <!-- Card 3 — Bow Glass Design (right) -->
      <div style="
        position: absolute;
        top: 480px;
        left: 728px;
        width: 270px;
        height: 340px;
        border-radius: 16px;
        overflow: hidden;
        box-shadow: 0 8px 24px rgba(61,44,0,0.15);
      ">
        <img
          src="https://pacaprints.com/cdn/shop/files/efc188c1d645278e594e750ce0dcea2a.png?v=1784066746&width=600"
          style="width: 100%; height: 100%; object-fit: cover; display: block;"
          alt="Personalised 21st Birthday Card with Bow Glass Design"
        >
      </div>

      <!-- CTA pill -->
      <div style="
        position: absolute;
        bottom: 56px;
        left: 50%;
        transform: translateX(-50%);
        background: #b8e0d2;
        color: #3d2c00;
        font-family: 'Varela Round', Arial, sans-serif;
        font-size: 30px;
        padding: 18px 56px;
        border-radius: 60px;
        white-space: nowrap;
        box-shadow: 0 4px 12px rgba(61,44,0,0.12);
      ">Cards from £3.49 · Shop now ↓</div>

    </div>
  </div>

</body>
</html>
