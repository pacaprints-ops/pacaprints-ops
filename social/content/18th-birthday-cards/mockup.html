<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>18th Birthday Cards — Paca Prints</title>
  <link href="https://fonts.googleapis.com/css2?family=Varela+Round&family=Sacramento&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      padding: 40px;
      background: #ddd;
    }
    .preview-label {
      font-family: sans-serif;
      font-size: 13px;
      color: #888;
      margin-bottom: 12px;
    }
  </style>
</head>
<body>

  <div class="preview-label">Instagram Feed Post — 1080×1080px (shown at 50% scale)</div>

  <div style="width: 1100px; height: 560px; overflow: hidden;">
    <div id="post" style="
      width: 1080px;
      height: 1080px;
      transform: scale(0.5);
      transform-origin: top left;
      background-color: #f7d9c4;
      position: relative;
      box-sizing: border-box;
      overflow: hidden;
      font-family: 'Varela Round', Arial, sans-serif;
    ">

      <!-- Mint curved top panel -->
      <div style="
        position: absolute;
        top: 0; left: 0; right: 0;
        height: 310px;
        background: #b8e0d2;
        border-radius: 0 0 60% 60% / 0 0 80px 80px;
      "></div>

      <!-- Logo — top centre -->
      <div style="
        position: absolute;
        top: 28px;
        left: 50%;
        transform: translateX(-50%);
        width: 240px;
        text-align: center;
      ">
        <img
          src="../../assets/PacaPrints%20Logo%20.png"
          style="width: 240px; display: block; mix-blend-mode: multiply;"
          alt="Paca Prints logo"
        >
      </div>

      <!-- Sacramento label -->
      <div style="
        position: absolute;
        top: 226px;
        width: 100%;
        text-align: center;
        font-family: 'Sacramento', cursive;
        font-size: 52px;
        color: #3d2c00;
        letter-spacing: 1px;
      ">18th Birthday Collection</div>

      <!-- Headline -->
      <div style="
        position: absolute;
        top: 308px;
        width: 100%;
        text-align: center;
        padding: 0 70px;
        box-sizing: border-box;
        font-family: 'Varela Round', Arial, sans-serif;
        font-size: 72px;
        color: #3d2c00;
        line-height: 1.15;
      ">Cards that say what you're actually thinking 🎂</div>

      <!-- Three product card images -->

      <!-- Card 1 — You're an Actual Adult Now -->
      <div style="
        position: absolute;
        top: 530px;
        left: 85px;
        width: 270px;
        height: 340px;
        border-radius: 16px;
        overflow: hidden;
        box-shadow: 0 8px 24px rgba(61,44,0,0.15);
        margin-top: 24px;
      ">
        <img
          src="https://pacaprints.com/cdn/shop/files/rn-image_picker_lib_temp_53b0a134-d05c-4ec8-9929-e82933cd98f3.jpg?v=1783373424&width=600"
          style="width: 100%; height: 100%; object-fit: cover; display: block;"
          alt="You're an Actual Adult Now birthday card"
        >
      </div>

      <!-- Card 2 — You Have Been Loved For (raised, centre) -->
      <div style="
        position: absolute;
        top: 498px;
        left: 405px;
        width: 270px;
        height: 340px;
        border-radius: 16px;
        overflow: hidden;
        box-shadow: 0 12px 32px rgba(61,44,0,0.2);
      ">
        <img
          src="https://pacaprints.com/cdn/shop/files/22e4036e3ae7375f9a66dbfdcd09202c.png?v=1781535445&width=600"
          style="width: 100%; height: 100%; object-fit: cover; display: block;"
          alt="You Have Been Loved For birthday card"
        >
      </div>

      <!-- Card 3 — Pint Glass Card -->
      <div style="
        position: absolute;
        top: 530px;
        left: 725px;
        width: 270px;
        height: 340px;
        border-radius: 16px;
        overflow: hidden;
        box-shadow: 0 8px 24px rgba(61,44,0,0.15);
        margin-top: 24px;
      ">
        <img
          src="https://pacaprints.com/cdn/shop/files/7fb2e677cce7bb627c805ad8336ff366.png?v=1783373003&width=600"
          style="width: 100%; height: 100%; object-fit: cover; display: block;"
          alt="Personalised 18th Birthday Pint Glass Card"
        >
      </div>

      <!-- CTA pill button -->
      <div style="
        position: absolute;
        bottom: 56px;
        left: 50%;
        transform: translateX(-50%);
        background: #b8e0d2;
        color: #3d2c00;
        font-family: 'Varela Round', Arial, sans-serif;
        font-size: 30px;
        font-weight: bold;
        padding: 18px 56px;
        border-radius: 60px;
        white-space: nowrap;
        box-shadow: 0 4px 12px rgba(61,44,0,0.12);
      ">Cards from £3.49 · Shop now ↓</div>

    </div>
  </div>

</body>
</html>
