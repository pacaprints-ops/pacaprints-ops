<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>18th Birthday Cards Mockup</title>
  <style>
    body {
      margin: 0;
      padding: 40px;
      background: #444;
    }
    .preview-label {
      font-family: sans-serif;
      font-size: 13px;
      color: #aaa;
      margin-bottom: 12px;
    }
  </style>
</head>
<body>

  <div class="preview-label">Instagram Feed Post — 1080×1080px (shown at 50% scale)</div>

  <div style="width: 1100px; height: 560px; overflow: hidden;">
    <div id="post" style="
      width: 1080px;
      height: 1080px;
      transform: scale(0.5);
      transform-origin: top left;
      background-color: #fafafa;
      position: relative;
      box-sizing: border-box;
      overflow: hidden;
    ">

      <!-- Headline -->
      <div style="
        position: absolute;
        top: 64px;
        left: 0;
        right: 0;
        text-align: center;
        padding: 0 60px;
        box-sizing: border-box;
      ">
        <div style="
          font-family: 'Arial Black', 'Helvetica Neue', Arial, sans-serif;
          font-size: 86px;
          font-weight: 900;
          color: #111111;
          line-height: 1.0;
          text-transform: uppercase;
          letter-spacing: -2px;
        ">They're 18.</div>
        <div style="
          font-family: 'Arial Black', 'Helvetica Neue', Arial, sans-serif;
          font-size: 86px;
          font-weight: 900;
          color: #111111;
          line-height: 1.0;
          text-transform: uppercase;
          letter-spacing: -2px;
          margin-top: 6px;
        ">God help them. 🎂</div>
      </div>

      <!-- Three product cards -->

      <!-- Card 1 — Holy Shit You're 18 -->
      <div style="
        position: absolute;
        top: 340px;
        left: 65px;
        width: 295px;
        height: 420px;
        border-radius: 10px;
        overflow: hidden;
        box-shadow: 0 10px 30px rgba(0,0,0,0.14);
        margin-top: 30px;
      ">
        <img
          src="https://pacaprints.com/cdn/shop/files/c55d103f69b577baa9a14e9d451394ed.png?v=1783372755&width=600"
          style="width: 100%; height: 100%; object-fit: cover; display: block;"
          alt="Holy Shit You're 18 Birthday Card"
        >
      </div>

      <!-- Card 2 — Your Childhood Has Expired (centre, raised) -->
      <div style="
        position: absolute;
        top: 305px;
        left: 393px;
        width: 295px;
        height: 420px;
        border-radius: 10px;
        overflow: hidden;
        box-shadow: 0 14px 40px rgba(0,0,0,0.18);
      ">
        <img
          src="https://pacaprints.com/cdn/shop/files/7f6eec7d6e818191839f6879fa66ea31.png?v=1783372628&width=600"
          style="width: 100%; height: 100%; object-fit: cover; display: block;"
          alt="Your Childhood Has Expired Birthday Card"
        >
      </div>

      <!-- Card 3 — You're On Your Own -->
      <div style="
        position: absolute;
        top: 340px;
        left: 721px;
        width: 295px;
        height: 420px;
        border-radius: 10px;
        overflow: hidden;
        box-shadow: 0 10px 30px rgba(0,0,0,0.14);
      ">
        <img
          src="https://pacaprints.com/cdn/shop/files/9525adf5c21fc1d7306784d4e3fa1a26.png?v=1783372883&width=600"
          style="width: 100%; height: 100%; object-fit: cover; display: block;"
          alt="Happy 18th You're On Your Own Birthday Card"
        >
      </div>

      <!-- Divider line -->
      <div style="
        position: absolute;
        top: 812px;
        left: 65px;
        right: 65px;
        height: 1px;
        background: #e0e0e0;
      "></div>

      <!-- Bottom text -->
      <div style="
        position: absolute;
        top: 840px;
        left: 0;
        right: 0;
        text-align: center;
      ">
        <div style="
          font-family: 'Arial Black', 'Helvetica Neue', Arial, sans-serif;
          font-size: 30px;
          font-weight: 900;
          color: #111111;
          text-transform: uppercase;
          letter-spacing: 1px;
        ">Funny 18th Birthday Cards</div>
        <div style="
          font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
          font-size: 26px;
          font-weight: 400;
          color: #777777;
          margin-top: 10px;
          letter-spacing: 0.5px;
        ">from £3.49 · personalised too · link in bio</div>
      </div>

    </div>
  </div>

</body>
</html>
